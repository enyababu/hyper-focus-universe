<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperfocus Universe</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090b18;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 25px;
}

h1 {
  font-weight: 300;
  letter-spacing: 4px;
  color: #d8c9ff;
}

header p {
  color: #a9a4c5;
}

.room {
  position: relative;
  width: 95%;
  max-width: 1100px;
  height: 600px;
  margin: 20px auto;
  overflow: hidden;
  border: 8px solid #252238;
  border-radius: 20px;
  background: linear-gradient(
    #242039 0%,
    #39304e 72%,
    #191522 72%
  );
  box-shadow: 0 0 60px #51417c55;
}

/* Weltraumfenster */

.window {
  position: absolute;
  top: 7%;
  left: 20%;
  width: 60%;
  height: 48%;
  border: 12px solid #171625;
  border-radius: 100px 100px 12px 12px;
  overflow: hidden;
  background: radial-gradient(
    ellipse at 65% 65%,
    #8062ad,
    #30275d 45%,
    #080e27 85%
  );
  box-shadow: 0 0 35px #a48bff55;
}

.stars {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(white 1px, transparent 2px),
    radial-gradient(#c5adff 1px, transparent 2px);
  background-size: 47px 53px, 79px 83px;
  background-position: 5px 8px, 25px 35px;
}

.planet {
  position: absolute;
  width: 95px;
  height: 95px;
  right: 17%;
  top: 17%;
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 30%,
    #e1c8ff,
    #8065bc,
    #302653
  );
  box-shadow: 0 0 35px #b9a1ff88;
}

/* Möbel */

.furniture {
  position: absolute;
  cursor: pointer;
  text-align: center;
  transition: transform 0.3s;
}

.furniture:hover {
  transform: translateY(-10px) scale(1.05);
}

.desk {
  left: 9%;
  bottom: 15%;
}

.sofa {
  right: 8%;
  bottom: 12%;
}

.chess {
  left: 44%;
  bottom: 13%;
}

.piano {
  right: 10%;
  top: 30%;
}

.object {
  font-size: 75px;
  filter: drop-shadow(0 8px 12px #0008);
}

.label {
  margin-top: 10px;
  padding: 8px 14px;
  border-radius: 20px;
  background: #151323cc;
  color: #e3d7ff;
  font-size: 13px;
}

.floor {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 12%;
  background: #14111f;
  border-top: 3px solid #655580;
}

footer {
  text-align: center;
  color: #8f88a9;
  padding: 25px;
}

@media (max-width: 600px) {
  .room {
    height: 480px;
  }

  .object {
    font-size: 45px;
  }

  .label {
    font-size: 10px;
    padding: 6px;
  }
}
</style>
</head>

<body>

<header>
  <h1>✦ HYPERFOCUS UNIVERSE ✦</h1>
  <p>Your personal space beyond reality</p>
</header>

<div class="room">

  <div class="window">
    <div class="stars"></div>
    <div class="planet"></div>
  </div>

  <div class="floor"></div>

  <div class="furniture desk"
       onclick="openRoom('Focus Studio')">
    <div class="object">💻</div>
    <div class="label">Focus Studio</div>
  </div>

  <div class="furniture chess"
       onclick="openRoom('Chess Room')">
    <div class="object">♟️</div>
    <div class="label">Chess Room</div>
  </div>

  <div class="furniture sofa"
       onclick="openRoom('Chill Zone')">
    <div class="object">🛋️</div>
    <div class="label">Chill Zone</div>
  </div>

  <div class="furniture piano"
       onclick="openRoom('Creative Space')">
    <div class="object">🎹</div>
    <div class="label">Creative Space</div>
  </div>

</div>

<footer>
  ✦ Your universe. Your rules. ✦
</footer>

<script>
function openRoom(name) {
  alert("Willkommen im " + name + "!");
}
</script>

</body>
</html>
