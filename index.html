<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hyperfocus Universe</title>

<style>

/* GRUNDDESIGN */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080711;
  color: white;
  font-family: Arial, sans-serif;
}

/* TITEL */

header {
  text-align: center;
  padding: 30px 15px;
}

h1 {
  color: #d8c5ff;
  font-weight: 300;
  letter-spacing: 4px;
}

.subtitle {
  color: #aaa0c7;
  font-size: 14px;
}

/* ZIMMER */

.room {
  position: relative;
  width: 96%;
  max-width: 1500px;
  margin: 20px auto;
  aspect-ratio: 16 / 9;

  background-image: url("space-loft.png");
  background-size: cover;
  background-position: center;

  border-radius: 18px;
  overflow: hidden;

  box-shadow:
    0 0 50px rgba(128, 87, 200, 0.3);
}

/* ANKLICKBARE GEGENSTÄNDE */

.hotspot {
  position: absolute;
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: 15px;
  background: transparent;
  transition: 0.3s;
}

.hotspot:hover,
.hotspot:focus-visible {
  background: rgba(180, 130, 255, 0.15);
  border: 1px solid #c8a5ff;
  box-shadow: 0 0 25px #a77cff;
}

/* POSITIONEN */

.desk {
  left: 2%;
  top: 30%;
  width: 30%;
  height: 35%;
}

.chess {
  left: 44%;
  top: 60%;
  width: 21%;
  height: 20%;
}

.piano {
  right: 3%;
  top: 32%;
  width: 25%;
  height: 30%;
}

.chill {
  left: 28%;
  top: 40%;
  width: 28%;
  height: 20%;
}

/* BESCHRIFTUNGEN */

.hotspot span {
  position: absolute;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);

  background: rgba(15, 10, 30, 0.85);
  color: #e6d7ff;

  padding: 8px 14px;
  border-radius: 20px;
  font-size: 12px;
  white-space: nowrap;

  opacity: 0;
  transition: 0.3s;
}

.hotspot:hover span,
.hotspot:focus-visible span {
  opacity: 1;
}

/* POPUP */

.popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  z-index: 100;

  align-items: center;
  justify-content: center;
}

.popup-content {
  background: #1b172c;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 450px;

  border: 1px solid #7960aa;
  box-shadow: 0 0 40px #60459a55;
}

.popup-content h2 {
  color: #d7baff;
}

.close {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 12px;

  background: #8c6bc5;
  color: white;
  cursor: pointer;
}

/* FUSSZEILE */

footer {
  text-align: center;
  padding: 25px;
  color: #8d82aa;
}

</style>
</head>

<body>

<header>
  <h1>✦ HYPERFOCUS UNIVERSE ✦</h1>
  <p class="subtitle">
    Your personal sanctuary among the stars
  </p>
</header>

<!-- VIRTUELLES ZIMMER -->

<main class="room" aria-label="Interaktives Space Penthouse">

  <!-- SCHREIBTISCH -->

  <button class="hotspot desk"
    aria-label="Focus Studio öffnen"
    onclick="openRoom('Focus Studio')">
    <span>🧠 Focus Studio</span>
  </button>

  <!-- SCHACH -->

  <button class="hotspot chess"
    aria-label="Chess Room öffnen"
    onclick="openRoom('Chess Room')">
    <span>♟️ Chess Room</span>
  </button>

  <!-- PIANO -->

  <button class="hotspot piano"
    aria-label="Creative Space öffnen"
    onclick="openRoom('Creative Space')">
    <span>🎹 Creative Space</span>
  </button>

  <!-- SOFA -->

  <button class="hotspot chill"
    aria-label="Chill Zone öffnen"
    onclick="openRoom('Chill Zone')">
    <span>🌙 Chill Zone</span>
  </button>

</main>

<!-- POPUP -->

<div class="popup" id="popup" role="dialog"
     aria-modal="true" aria-labelledby="popup-title">

  <div class="popup-content">

    <h2 id="popup-title"></h2>

    <p>
      Willkommen in deinem persönlichen Bereich.
    </p>

    <button class="close" onclick="closeRoom()">
      Zurück zum Penthouse
    </button>

  </div>

</div>

<footer>
  ✦ Your universe. Your rules. ✦
</footer>

<script>

function openRoom(name) {
  document.getElementById("popup-title").textContent = name;
  document.getElementById("popup").style.display = "flex";
}

function closeRoom() {
  document.getElementById("popup").style.display = "none";
}

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeRoom();
  }
});

</script>

</body>
</html>
